services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CS_WEBHOOK_BIND_ADDRESS:-127.0.0.1}:${CS_WEBHOOK_PORT:-8787}:${CS_WEBHOOK_PORT:-8787}"
      - "${CS_TEST_WEBHOOK_BIND_ADDRESS:-127.0.0.1}:${CS_TEST_WEBHOOK_PORT:-8788}:${CS_TEST_WEBHOOK_PORT:-8788}"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set in Dockhand}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set in Dockhand}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set in Dockhand}
      JOIN_TO_CREATE_CHANNEL_ID: ${JOIN_TO_CREATE_CHANNEL_ID:-}
      CS_CATEGORY_ID: ${CS_CATEGORY_ID:-}
      CS_TEAM_CATEGORY_ID: ${CS_TEAM_CATEGORY_ID:-}
      CS_LOBBY_CHANNEL_ID: ${CS_LOBBY_CHANNEL_ID:-}
      CS_TEXT_CHANNEL_ID: ${CS_TEXT_CHANNEL_ID:-}
      CS_PARTICIPANT_ROLE_ID: ${CS_PARTICIPANT_ROLE_ID:-}
      MANUAL_CS_PARTICIPANT_ROLE_ID: ${MANUAL_CS_PARTICIPANT_ROLE_ID:-}
      FOOD_ROUND_1_ROLE_ID: ${FOOD_ROUND_1_ROLE_ID:-}
      FOOD_ROUND_2_ROLE_ID: ${FOOD_ROUND_2_ROLE_ID:-}
      MEAL_TEXT_CHANNEL_ID: ${MEAL_TEXT_CHANNEL_ID:-}
      MEAL_SYNC_INTERVAL_MS: ${MEAL_SYNC_INTERVAL_MS:-300000}
      CS_ROLE_SYNC_ENABLED: ${CS_ROLE_SYNC_ENABLED:-false}
      CS_ROLE_SYNC_DRY_RUN: ${CS_ROLE_SYNC_DRY_RUN:-true}
      CS_VOICE_SYNC_ENABLED: ${CS_VOICE_SYNC_ENABLED:-false}
      CS_VOICE_SYNC_DRY_RUN: ${CS_VOICE_SYNC_DRY_RUN:-}
      CS_SYNC_DRY_RUN: ${CS_SYNC_DRY_RUN:-true}
      CS_SYNC_INTERVAL_MS: ${CS_SYNC_INTERVAL_MS:-300000}
      CS_EMPTY_CHANNEL_DELETE_DELAY_MS: ${CS_EMPTY_CHANNEL_DELETE_DELAY_MS:-30000}
      CS_WEBHOOK_PORT: ${CS_WEBHOOK_PORT:-8787}
      MAT_WEBHOOK_SECRET: ${MAT_WEBHOOK_SECRET:-}
      CS_TEST_WEBHOOK_PORT: ${CS_TEST_WEBHOOK_PORT:-8788}
      CS_TEST_WEBHOOK_SECRET: ${CS_TEST_WEBHOOK_SECRET:-}
      CREW_LOG_CHANNEL_ID: ${CREW_LOG_CHANNEL_ID:-}
      EMPTY_CHANNEL_DELETE_DELAY_MS: ${EMPTY_CHANNEL_DELETE_DELAY_MS:-300000}
      ACCESS_CHANNEL_ID: ${ACCESS_CHANNEL_ID:-}
      ACCESS_ROLE_ID: ${ACCESS_ROLE_ID:-}
      MANUAL_ACCESS_ROLE_ID: ${MANUAL_ACCESS_ROLE_ID:-}
      CREW_ROLE_ID: ${CREW_ROLE_ID:-}
      REGISTRATION_URL: ${REGISTRATION_URL:-https://ntlan.no/}
      REGISTRATION_API_URL: ${REGISTRATION_API_URL:-}
      REGISTRATION_TOKEN_URL: ${REGISTRATION_TOKEN_URL:-}
      REGISTRATION_CLIENT_ID: ${REGISTRATION_CLIENT_ID:-}
      REGISTRATION_CLIENT_SECRET: ${REGISTRATION_CLIENT_SECRET:-}
      MAT_URL: ${MAT_URL:-}
      MAT_API_TOKEN: ${MAT_API_TOKEN:-}
      ACCESS_DRY_RUN: ${ACCESS_DRY_RUN:-true}
      ACCESS_SYNC_INTERVAL_MS: ${ACCESS_SYNC_INTERVAL_MS:-15000}
    volumes:
      - bot-data:/app/data
      - ./messages.json:/app/messages.json:ro

volumes:
  bot-data: