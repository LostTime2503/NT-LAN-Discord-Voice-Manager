services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nt-lan-voice-manager
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set in Dockhand}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set in Dockhand}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set in Dockhand}
      JOIN_TO_CREATE_CHANNEL_ID: ${JOIN_TO_CREATE_CHANNEL_ID:-}
      CS_TEAM_CATEGORY_ID: ${CS_TEAM_CATEGORY_ID:-}
      CREW_LOG_CHANNEL_ID: ${CREW_LOG_CHANNEL_ID:-}
      EMPTY_CHANNEL_DELETE_DELAY_MS: ${EMPTY_CHANNEL_DELETE_DELAY_MS:-300000}
      ACCESS_CHANNEL_ID: ${ACCESS_CHANNEL_ID:-}
      ACCESS_ROLE_ID: ${ACCESS_ROLE_ID:-}
      CREW_ROLE_ID: ${CREW_ROLE_ID:-}
      REGISTRATION_URL: ${REGISTRATION_URL:-https://ntlan.no/}
      REGISTRATION_API_URL: ${REGISTRATION_API_URL:-}
      REGISTRATION_TOKEN_URL: ${REGISTRATION_TOKEN_URL:-}
      REGISTRATION_CLIENT_ID: ${REGISTRATION_CLIENT_ID:-}
      REGISTRATION_CLIENT_SECRET: ${REGISTRATION_CLIENT_SECRET:-}
      ACCESS_DRY_RUN: ${ACCESS_DRY_RUN:-true}
      ACCESS_SYNC_INTERVAL_MS: ${ACCESS_SYNC_INTERVAL_MS:-60000}
    volumes:
      - bot-data:/app/data

volumes:
  bot-data: